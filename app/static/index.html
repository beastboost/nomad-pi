<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Nomad Pi</title>
    <link rel="icon" href="data:,">
    <!-- Vendored first so an offline Pi renders fully; scripts/vendor-assets.sh
         populates /vendor at setup and update time. If it has not run, each
         link falls back to the CDN via onerror. -->
    <link rel="stylesheet" href="vendor/phosphor/regular.css"
          onerror="this.onerror=null;this.href='https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css'">
    <link rel="stylesheet" href="vendor/phosphor/fill.css"
          onerror="this.onerror=null;this.href='https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css'">
    <link rel="stylesheet" href="vendor/inter/inter.css"
          onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'">
    <link rel="stylesheet" href="css/nocturne.css?v=1782016000">
    <link rel="manifest" href="manifest.json?v=1782016000">
    <meta name="theme-color" content="#161826">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nomad Pi">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Nomad Pi">
    <meta name="msapplication-TileColor" content="#161826">
    <meta name="msapplication-tap-highlight" content="no">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════ Login ── -->
<div id="login-screen" class="hidden">
    <div class="login-box">
        <div class="kicker kicker-accent">Private media hub</div>
        <div class="login-brand" style="margin-top:8px">Nomad Pi</div>
        <p class="login-copy">Sign in to browse your library, manage downloads, and check the box.</p>
        <form class="login-form" id="login-form" autocomplete="on">
            <input type="text" id="username-input" class="input input-plain" placeholder="Username"
                   value="admin" autocomplete="username" autocapitalize="none" spellcheck="false">
            <input type="password" id="password-input" class="input input-plain" placeholder="Password"
                   autocomplete="current-password">
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Enter Nomad</button>
        </form>
        <p id="login-error" class="login-error"></p>
        <p id="setup-hint" class="login-hint hidden"></p>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════ App ── -->
<div id="app-shell" class="hidden">

    <!-- ── Home ─────────────────────────────────────────────────── -->
    <section class="screen" id="screen-home" data-screen="home">
        <div class="screen-scroll pv">
            <div class="screen-head">
                <div class="head-row">
                    <div>
                        <div class="kicker kicker-accent" id="home-device">Nomad Pi</div>
                        <h1 id="home-greeting">Welcome back</h1>
                    </div>
                    <button class="btn btn-icon" data-go="search" aria-label="Search">
                        <i class="ph ph-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <button class="btn status-pill" data-tab="server" id="home-status">
                <span class="status-dot" id="home-status-dot"></span>
                <span class="status-text" id="home-status-text">Checking server…</span>
                <i class="ph ph-caret-right" style="font-size:14px;color:var(--text-45)"></i>
            </button>

            <div class="section section-pad" id="home-hero-wrap" style="margin-top:22px">
                <div class="kicker" style="margin-bottom:10px">Pick up where you left off</div>
                <div id="home-hero"></div>
            </div>

            <div class="section" id="home-continue-wrap">
                <div class="section-head">
                    <div class="kicker">Continue watching</div>
                    <button class="btn-link" data-tab="library">All</button>
                </div>
                <div class="rail pv" id="home-continue"></div>
            </div>

            <div class="section" id="home-recent-wrap">
                <div class="section-head">
                    <div class="kicker">Recently added</div>
                    <button class="btn-link" data-tab="library">All</button>
                </div>
                <div class="rail pv" id="home-recent"></div>
            </div>
        </div>
    </section>

    <!-- ── Library ──────────────────────────────────────────────── -->
    <section class="screen" id="screen-library" data-screen="library">
        <div class="screen-head">
            <div class="head-row">
                <h1>Library</h1>
                <button class="btn btn-icon" data-go="search" aria-label="Search">
                    <i class="ph ph-magnifying-glass"></i>
                </button>
            </div>
        </div>
        <div class="chip-scroller pv" id="lib-tabs"></div>
        <div class="lib-meta">
            <span class="lib-count" id="lib-count"></span>
            <button class="chip" id="lib-sort-btn">
                <i class="ph ph-sliders-horizontal" style="font-size:15px"></i>
                <span id="lib-sort-label">Name</span>
            </button>
        </div>
        <div class="lib-body pv" id="lib-body"></div>
    </section>

    <!-- ── Downloads ────────────────────────────────────────────── -->
    <section class="screen" id="screen-downloads" data-screen="downloads">
        <div class="screen-head">
            <h1>Downloads</h1>
            <div class="chip-equal" style="margin-top:14px" id="dl-tabs"></div>
        </div>
        <div class="dl-body pv" id="dl-body"></div>
    </section>

    <!-- ── Server ───────────────────────────────────────────────── -->
    <section class="screen" id="screen-server" data-screen="server">
        <div class="screen-head">
            <h1 id="server-name">Nomad Pi</h1>
            <div class="head-sub" id="server-sub">—</div>
        </div>
        <div class="dl-body pv" id="server-body"></div>
    </section>

    <!-- ── Detail ───────────────────────────────────────────────── -->
    <section class="screen" id="screen-detail" data-screen="detail">
        <div class="screen-scroll pv" id="detail-body"></div>
    </section>

    <!-- ── Search ───────────────────────────────────────────────── -->
    <section class="screen" id="screen-search" data-screen="search">
        <div class="screen-head" style="display:flex;align-items:center;gap:10px">
            <button class="btn btn-icon" data-back aria-label="Back"><i class="ph ph-arrow-left"></i></button>
            <div class="search-field" style="flex:1">
                <i class="ph ph-magnifying-glass"></i>
                <input type="search" id="search-input" class="input input-sm" placeholder="Search everything"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
            </div>
        </div>
        <div class="screen-scroll pv" style="padding:20px 20px 96px" id="search-body"></div>
    </section>

    <!-- ── Settings ─────────────────────────────────────────────── -->
    <section class="screen" id="screen-settings" data-screen="settings">
        <div class="screen-head" style="display:flex;align-items:center;gap:12px">
            <button class="btn btn-icon" data-back aria-label="Back"><i class="ph ph-arrow-left"></i></button>
            <h1 style="font-size:22px">Settings</h1>
        </div>
        <div class="screen-scroll pv" style="padding:20px 20px 96px" id="settings-body"></div>
    </section>

    <!-- ── Generic sub-page (admin screens, shows, playlists) ───── -->
    <section class="screen" id="screen-sub" data-screen="sub">
        <div class="screen-head" style="display:flex;align-items:center;gap:12px">
            <button class="btn btn-icon" data-back aria-label="Back"><i class="ph ph-arrow-left"></i></button>
            <div style="min-width:0;flex:1">
                <h1 id="sub-title" style="font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</h1>
                <div class="head-sub" id="sub-desc" style="margin-top:2px"></div>
            </div>
            <button class="btn btn-icon hidden" id="sub-action" aria-label="Action"><i class="ph ph-plus"></i></button>
        </div>
        <div class="screen-scroll pv" style="padding:18px 20px 96px" id="sub-body"></div>
    </section>

    <!-- ── Reader (books, comics, PDF, images) ──────────────────── -->
    <section class="screen" id="screen-reader" data-screen="reader">
        <div class="reader-top" id="reader-top">
            <button class="btn btn-icon" data-back aria-label="Close"><i class="ph ph-arrow-left"></i></button>
            <div class="player-heading">
                <div class="t" id="reader-title">—</div>
                <div class="s" id="reader-sub"></div>
            </div>
            <button class="btn btn-icon" id="reader-menu" aria-label="Reader options"><i class="ph ph-list"></i></button>
        </div>
        <div class="reader-stage" id="reader-stage"></div>
        <div class="reader-bar" id="reader-bar">
            <button class="btn btn-icon" id="reader-prev" aria-label="Previous page"><i class="ph ph-caret-left"></i></button>
            <input type="range" id="reader-range" min="1" max="1" value="1" class="reader-range" aria-label="Page">
            <span class="reader-count" id="reader-count">1 / 1</span>
            <button class="btn btn-icon" id="reader-next" aria-label="Next page"><i class="ph ph-caret-right"></i></button>
        </div>
    </section>

    <!-- ── Player ───────────────────────────────────────────────── -->
    <section class="screen" id="screen-player" data-screen="player">
        <div class="player-stage" id="player-stage">
            <i class="ph ph-film-strip player-ghost" id="player-ghost"></i>
            <div class="player-top">
                <button class="btn btn-icon" data-back aria-label="Close player"><i class="ph ph-caret-down"></i></button>
                <div class="player-heading">
                    <div class="t" id="player-title">—</div>
                    <div class="s" id="player-sub"></div>
                </div>
                <button class="btn btn-icon" id="player-cast" aria-label="Picture in picture"><i class="ph ph-screencast"></i></button>
            </div>
        </div>
        <div class="player-controls">
            <div class="scrubber" id="player-scrubber">
                <div class="scrub-track">
                    <div class="scrub-fill" id="player-fill" style="width:0%"></div>
                    <div class="scrub-knob" id="player-knob" style="left:0%"></div>
                </div>
                <div class="scrub-times">
                    <span id="player-elapsed">0:00</span>
                    <span id="player-remaining">-0:00</span>
                </div>
            </div>
            <div class="transport">
                <button class="transport-btn" id="player-back15" aria-label="Back 15 seconds"><i class="ph ph-arrow-counter-clockwise"></i></button>
                <button class="transport-btn transport-play" id="player-play" aria-label="Play or pause"><i class="ph-fill ph-play"></i></button>
                <button class="transport-btn" id="player-fwd30" aria-label="Forward 30 seconds"><i class="ph ph-arrow-clockwise"></i></button>
            </div>
            <div class="player-extras">
                <button class="btn" id="player-subs"><i class="ph ph-closed-captioning" style="font-size:17px"></i>Subtitles</button>
                <button class="btn" id="player-audio"><i class="ph ph-speaker-high" style="font-size:17px"></i>Audio</button>
                <button class="btn" id="player-speed"><i class="ph ph-gauge" style="font-size:17px"></i>1.0×</button>
            </div>
        </div>
    </section>

    <!-- ── Now playing (audio) ──────────────────────────────────── -->
    <div class="mini-player hidden" id="mini-player">
        <div class="mini-art"><i class="ph ph-music-note"></i></div>
        <div class="mini-body">
            <div class="mini-title" id="mini-title"></div>
            <div class="mini-sub" id="mini-sub"></div>
        </div>
        <button class="mini-play" id="mini-play" aria-label="Play or pause"><i class="ph-fill ph-play"></i></button>
    </div>

    <div id="now-playing-sheet" class="hidden">
        <div class="np-head">
            <button class="btn btn-icon" id="np-close" aria-label="Close"><i class="ph ph-caret-down"></i></button>
        </div>
        <div class="np-body">
            <div class="np-art"><i class="ph ph-music-notes"></i></div>
            <div style="margin-top:26px">
                <div class="np-title" id="np-title"></div>
                <div class="np-artist" id="np-artist"></div>
            </div>
            <div class="scrubber" id="np-scrubber" style="margin-top:24px">
                <div class="scrub-track">
                    <div class="scrub-fill" id="np-fill" style="width:0%"></div>
                    <div class="scrub-knob" id="np-knob" style="left:0%"></div>
                </div>
                <div class="scrub-times">
                    <span id="np-elapsed">0:00</span>
                    <span id="np-remaining">-0:00</span>
                </div>
            </div>
            <div class="np-transport">
                <button class="transport-btn" id="np-prev" aria-label="Previous"><i class="ph-fill ph-skip-back"></i></button>
                <button class="transport-btn transport-play" id="np-play" aria-label="Play or pause"><i class="ph-fill ph-play"></i></button>
                <button class="transport-btn" id="np-next" aria-label="Next"><i class="ph-fill ph-skip-forward"></i></button>
            </div>
        </div>
        <div class="np-foot">
            <button class="btn btn-icon" id="np-shuffle" aria-label="Shuffle"><i class="ph ph-shuffle"></i></button>
            <button class="btn btn-icon" id="np-repeat" aria-label="Repeat"><i class="ph ph-repeat"></i></button>
            <button class="btn btn-icon" id="np-queue" aria-label="Queue"><i class="ph ph-queue"></i></button>
            <button class="btn btn-icon" id="np-stop" aria-label="Stop"><i class="ph ph-stop"></i></button>
        </div>
    </div>

    <!-- ── Sheets / dialogs / toasts ────────────────────────────── -->
    <div class="scrim hidden" id="sheet-scrim"></div>
    <div class="sheet hidden" id="sheet"></div>
    <div class="dialog-wrap hidden" id="dialog-wrap">
        <div class="dialog">
            <div class="dialog-title" id="dialog-title"></div>
            <p class="dialog-body" id="dialog-body"></p>
            <div class="dialog-actions">
                <button class="btn" id="dialog-cancel">Cancel</button>
                <button class="btn btn-primary" id="dialog-confirm">Confirm</button>
            </div>
        </div>
    </div>
    <div id="toast-stack"></div>

    <!-- ── Tab bar ──────────────────────────────────────────────── -->
    <nav id="tabbar">
        <button class="tab active" data-tab="home">
            <i class="ph-fill ph-house"></i><span>Home</span>
        </button>
        <button class="tab" data-tab="library">
            <i class="ph ph-squares-four"></i><span>Library</span>
        </button>
        <button class="tab" data-tab="downloads">
            <i class="ph ph-arrow-circle-down"></i><span>Downloads</span>
        </button>
        <button class="tab" data-tab="server">
            <i class="ph ph-hard-drives"></i><span>Server</span>
        </button>
    </nav>
</div>

<script src="vendor/epub/epub.min.js" onerror="this.remove()"></script>
<script src="js/reader.js?v=1782016000"></script>
<script src="js/features.js?v=1782016000"></script>
<script src="js/admin.js?v=1782016000"></script>
<script src="js/app.js?v=1782016000"></script>
</body>
</html>
