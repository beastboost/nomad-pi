name: Nomad Pi Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python and frontend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Check frontend JavaScript syntax
        run: |
          node --check app/static/js/app.js
          node --check app/static/js/app_legacy.js
          node --check app/static/js/playback-core.js
          node --check app/static/sw.js

      - name: Check shell scripts
        run: |
          bash -n scripts/vendor-assets.sh

      - name: Run tests
        env:
          ALLOW_INSECURE_DEFAULT: 'true'
        run: python -m pytest tests/ -q
