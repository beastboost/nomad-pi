name: Nomad Pi Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python, frontend and playback runtime suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests
          python -m py_compile scripts/playback-selftest.py
          python -m py_compile scripts/gst-a733-hls.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check app/static/js/app.js
          node --check app/static/js/app_legacy.js
          node --check app/static/js/playback-core.js
          node --check app/static/js/runtime-ui-guard.js
          node --check app/static/js/debrid-lite.js
          node --check app/static/js/player-mobile-fix.js
          node --check app/static/js/direct-play-guard.js
          node --check app/static/js/replacement-control.js
          node --check app/static/js/track-control.js
          node --check app/static/js/subtitle-control.js
          node --check app/static/js/quality-control.js
          node --check app/static/js/device-control.js
          node --check app/static/js/watch-party.js
          node --check app/static/js/audio-direct-bridge.js
          node --check app/static/js/music2-player.js
          node --check app/static/js/music-player-polish.js
          node --check app/static/js/music2-fallback.js
          node --check app/static/js/media-exclusivity.js
          node --check app/static/js/stream-keep-control.js
          node --check app/static/js/universal-search.js
          node --check app/static/js/series-download-picker.js
          node --check app/static/js/universal-home.js
          node --check app/static/js/offline-control.js
          node --check app/static/js/download-live.js
          node --check app/static/js/library-health.js
          node --check app/static/js/media-actions.js
          node --check app/static/js/storage-failover.js
          node --check app/static/js/playback-health-ui.js
          node --check app/static/js/profile-context.js
          node --check app/static/js/profile-switch.js
          node --check app/static/js/gallery-photos.js
          node --check app/static/js/gallery-library-guard.js
          node --check app/static/js/reader-state.js
          node --check app/static/js/reader-ui-polish.js
          node --check app/static/sw.js

      - name: Check shell scripts
        run: |
          bash -n setup.sh
          bash -n update.sh
          bash -n scripts/platform-detect.sh
          bash -n scripts/install-common.sh
          bash -n scripts/network-appliance.sh
          bash -n scripts/port80-redirect.sh
          bash -n scripts/vendor-assets.sh
          bash -n scripts/wifi-guard.sh
          bash -n os-builder/stage3-nomad/03-setup-services/files/nomad-pi-firstboot.sh
          bash -n os-builder/stage3-nomad/03-setup-services/files/nomad-port80-redirect.sh

      - name: Run unit and regression tests
        env:
          ALLOW_INSECURE_DEFAULT: 'true'
        run: python -m pytest tests/ -q

      - name: Run real FFmpeg HLS smoke tests
        env:
          ALLOW_INSECURE_DEFAULT: 'true'
        run: python scripts/playback-selftest.py --smoke-hls --smoke-abr
